<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 2</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
</head>
<body>
    <!-- NGL el asistente de VS me hizo varios paros. -->
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-assets>
      <a-asset-item id="drone" src="mech_drone.glb"></a-asset-item>
      <audio id="musica" src="Invierno_Allegro_estilo_Vivaldi 5.mp3" preload="auto"></audio>
    </a-assets>
    <a-entity gltf-model="#drone"
              position="-2 0 -3"
              scale="2 2 2"
              rotation="0 90 0"
              animation-mixer="clip: *; loop: repeat">
    </a-entity>
    <a-box id="BOTONDEMUSICA"
           class="clickable"
           position="-0.5 0.5 -3"
           width="0.7" height="0.7" depth="0.7"
           color="green"
           sound="src: #musica; autoplay: false; positional: false">
    </a-box>
    <a-plane position="0 -0.05 -4" rotation="-90 0 0" width="10" height="10" color="#A7A5CC"></a-plane>
    <a-sky color="#DEFDFF"></a-sky>
    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
  <script>
    document.querySelector('#BOTONDEMUSICA').addEventListener('click', function () {
      this.components.sound.playSound();
    });
  </script>
<!-- Un sonido posicional depende de la posición del listener y su ubicación en el espacio. -->
<!-- Un sonido no posicional se reproduce de forma independiente de la posición del listener. -->
</body>
</html>
